[build]
  command = "npm run build"
  publish = "dist"

[functions]
  # lead.mts declares its own route via `export const config = { path: "/api/lead" }`
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback. Functions are matched before this, so /api/lead is unaffected.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Carried over from the retired nginx config so the security posture does not
# regress with the move off the droplet.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
